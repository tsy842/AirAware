<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AirAware — Breathe Smarter. Stay Safer. Build Climate Resilience.</title>
    <meta name="description" content="Climate resilience and clean air intelligence platform providing real-time air quality monitoring, weather risk analysis, extreme emergency preparedness, and AI-powered environmental advisory." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AirAware" />
    <meta name="application-name" content="AirAware" />
    <meta name="msapplication-TileColor" content="#020617" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="AirAware — Climate Resilience & Clean Air Intelligence" />
    <meta property="og:description" content="Climate resilience and clean air intelligence platform providing real-time air quality monitoring, weather risk analysis, extreme emergency preparedness, and AI-powered environmental advisory." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Manifest & Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Leaflet & Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-teal-500 selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA & Offline resilience
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('AirAware PWA ServiceWorker registered:', reg.scope))
            .catch(err => console.warn('PWA registration skipped:', err));
        });
      }
    </script>
  </body>
</html>
